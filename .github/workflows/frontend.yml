name: Frontend Deploy

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: |
          npm ci
          npm run build

      - run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - run: |
          sshpass -p "${{ secrets.DROPLET_PASSWORD }}" \
          scp -o StrictHostKeyChecking=no -r . \
          ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/srv/rvdc

      - run: |
          sshpass -p "${{ secrets.DROPLET_PASSWORD }}" \
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} << 'EOF'
            cd /srv/rvdc
            npm ci --omit=dev
            pm2 restart rvdc-frontend || pm2 start ecosystem.config.js
            pm2 save
          EOF
