name: Build & Deploy Frontend Docker

on:
  push:
    branches: [ "master" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Docker login
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build and push image
      - run: |
          docker build -t rnldvrgl/rvdc:latest .
          docker push rnldvrgl/rvdc:latest

      # Deploy on droplet
      - name: Deploy to droplet
        run: |
          sshpass -p "${{ secrets.DROPLET_PASSWORD }}" ssh -o StrictHostKeyChecking=no root@${{ secrets.DROPLET_HOST }} << 'EOF'
            docker pull rnldvrgl/rvdc:latest
            docker stop rvdc || true
            docker rm rvdc || true
            docker run -d --name rvdc -p 3000:3000 rnldvrgl/rvdc:latest
          EOF
